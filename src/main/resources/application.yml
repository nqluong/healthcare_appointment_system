server:
  port: 8080
  username-admin: ${ADMIN_USERNAME}
  password-admin: ${ADMIN_PASSWORD}
  servlet:
    context-path: /healthcare
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

spring:
  datasource:
    url: "jdbc:${DB_URL}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
    signer-key: "${SECRET_KEY}"
    expiration: 3600 # in seconds
    refresh:
        expiration: 36000
file:
  upload:
    base-path: uploads
    max-size: 5242880
